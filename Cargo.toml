[workspace]
resolver = "2"

exclude = ["ptoken", "pinocchio-constraints"]

members = [
  "crates/error",
  "crates/http",
  "crates/shared",
  "crates/functions/cron",
  "crates/functions/pubsub",
  "crates/functions/api",
  "crates/database"
]

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
cloudevents-sdk = { version = "0.9", features = ["axum"] }
google-cloud-pubsub = { version = "1.7", default-features = false }
google-cloud-gax = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
toasty = { version = "0.11", features = ["postgresql", "migration", "jiff", "serde"] }
toasty-core = "0.11"
jiff = { version = "0.2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
