[package]
name = "pinocchio-constraints"
version = "0.1.0"
edition = "2024"
description = "Account constraints and instruction contexts for Pinocchio programs"

[workspace]
members = ["derive"]
resolver = "3"

[features]
default = []
spl = [
    "dep:pinocchio-associated-token-account",
    "dep:pinocchio-token",
    "dep:pinocchio-token-2022",
    "pinocchio-constraints-derive/spl",
]

[dependencies]
pinocchio = { version = "0.12", default-features = false }
pinocchio-constraints-derive = { path = "derive" }
pinocchio-associated-token-account = { version = "0.5", optional = true }
pinocchio-token = { version = "0.8", optional = true }
pinocchio-token-2022 = { version = "0.5", optional = true }

[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }
